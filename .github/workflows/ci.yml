name: CI

on:
  push:
  pull_request:
  # "Run workflow" on the Actions tab, once this file is on the default branch
  # (main). Until then, rebuild with "Re-run all jobs" on the latest run.
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tools:
    name: Config and tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - name: Validate the balance config
        run: python3 tools/config_tool.py validate
      - name: Check the reference test vectors are current
        run: python3 tools/gen_vectors.py --check
      - name: Check the generated battles are current
        run: python3 tools/gen_battles.py --check
      - name: Tool tests
        run: python3 -m pytest -q tools/tests

  # The phone is ARM and the worker is x86-64, and both must give the same
  # hashes. This runs the C++ core alone on both, with both compilers, before
  # any phone does: sanitized, and as -O2 and -O3 builds like the ones that ship,
  # against the vectors, the goldens, the committed generated battles and fresh
  # ones checked against the reference model (D-028). The fresh battles' seed is
  # the run number, so every run tries new ones; a failure prints how to rerun it.
  core:
    name: Sim core, ${{ matrix.cxx }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Sim core in C++, against the vectors, goldens and generated battles
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          python3 tools/check_sim_native.py --fuzz 400 --fuzz-seed ${{ github.run_number }}
          --digest "$RUNNER_TEMP/core-digest.txt"
      - name: Keep the failing battles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-failures-${{ strategy.job-index }}
          path: build/sim-native-check/fuzz-failures/
          if-no-files-found: ignore
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: core-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/core-digest.txt
          overwrite: true

  # Each core job above already matches the model, so they agree with each other
  # through it. This compares their answers directly too, so a platform
  # difference can't hide behind a gap in the model.
  core-agree:
    name: Sim core gives the same answers everywhere
    runs-on: ubuntu-24.04
    needs: core
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: core-digest-*
          path: digests
      - name: Every platform and compiler gave the same answers
        run: |
          for f in digests/*/core-digest.txt; do echo "$f: $(cat "$f")"; done
          [ "$(ls digests/*/core-digest.txt | wc -l)" -eq 4 ] || { echo "::error::expected 4 digests"; exit 1; }
          [ "$(cat digests/*/core-digest.txt | sort -u | wc -l)" -eq 1 ] || {
            echo "::error::the sim core gave different answers on different platforms or compilers"
            exit 1
          }

  sim:
    name: Sim tests, headless and desktop
    runs-on: ubuntu-24.04
    needs: [tools, core-agree]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements-build.txt
      - name: Cache godot-cpp and the sim core's Linux build
        uses: actions/cache@v6
        with:
          path: |
            build/godot-cpp
            build/scons-cache
          key: sim-native-linux-${{ hashFiles('tools/build_sim_native.sh', 'sim/native/SConstruct', 'sim/native/build_profile.json') }}
      - name: Build the sim core for Linux
        env:
          SCONS_CACHE: ${{ github.workspace }}/build/scons-cache
        run: tools/build_sim_native.sh linux
      - uses: actions/upload-artifact@v7
        with:
          name: sim-native-linux
          path: sim/bin/
          overwrite: true
      - name: Install Godot
        run: tools/ci/install_godot.sh
      - name: Copy the sim core into the Godot projects
        run: python3 tools/sync_sim.py
      - name: Import the worker project
        run: tools/ci/run_godot.sh 300 godot --headless --path worker --import
      - name: Unit and golden tests on the headless worker
        run: |
          if [ ! -f sim/tests/golden/expected.json ]; then
            # Only after a deliberate re-record (a SIM_VERSION bump): record on
            # this runner for review, upload them, and fail.
            mkdir -p "$RUNNER_TEMP/golden"
            tools/ci/run_godot.sh 600 godot --headless --path worker --script res://cli/run_tests.gd -- --record "$RUNNER_TEMP/golden/expected.json" || true
            echo "::error::sim/tests/golden/expected.json is missing. Hashes recorded on this runner are in the golden-hashes artifact: review them and commit the file."
            exit 1
          fi
          tools/ci/run_godot.sh 600 godot --headless --path worker --script res://cli/run_tests.gd
      - name: Upload newly recorded golden hashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-hashes
          path: ${{ runner.temp }}/golden/expected.json
          if-no-files-found: ignore
          overwrite: true
      - name: Cache the plugin downloads
        uses: actions/cache@v6
        with:
          path: build/plugin-cache
          key: plugin-downloads-${{ hashFiles('tools/fetch_plugins.sh') }}
      - name: Fetch the third-party Android plugins
        run: tools/fetch_plugins.sh
      - name: Import the client project
        run: tools/ci/run_godot.sh 300 godot --headless --path client --import
      - name: Unit and golden tests on the desktop client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri
          xvfb-run -a tools/ci/run_godot.sh 600 godot --path client --rendering-driver opengl3 -- --run-tests-and-quit

  android:
    name: Android test build
    runs-on: ubuntu-24.04
    needs: sim
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          # MIT-licensed caching; the default "enhanced" provider needs the
          # owner to accept Gradle's terms (docs/DECISIONS.md D-023).
          cache-provider: basic
      - name: Install Godot and export templates
        run: tools/ci/install_godot.sh --templates
      - name: Get the sim core's Linux build, for the editor that exports
        uses: actions/download-artifact@v8
        with:
          name: sim-native-linux
          path: sim/bin/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements-build.txt
      - name: Install the Android NDK that Godot 4.7.2 builds with (tools/build_sim_native.sh)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
      - name: Cache godot-cpp and the sim core's Android build
        uses: actions/cache@v6
        with:
          path: |
            build/godot-cpp
            build/scons-cache
          key: sim-native-android-${{ hashFiles('tools/build_sim_native.sh', 'sim/native/SConstruct', 'sim/native/build_profile.json') }}
      - name: Build the sim core for Android
        env:
          SCONS_CACHE: ${{ github.workspace }}/build/scons-cache
        run: tools/build_sim_native.sh android
      - name: Cache the plugin downloads
        uses: actions/cache@v6
        with:
          path: build/plugin-cache
          key: plugin-downloads-${{ hashFiles('tools/fetch_plugins.sh') }}
      - name: Fetch the third-party Android plugins
        run: tools/fetch_plugins.sh
      - name: Build our Android plugins
        run: tools/build_android_plugins.sh
      - name: Prepare the export
        id: prepare
        env:
          # The owner's upload key (docs/PLUGINS.md). Without it the debug APK
          # gets a throwaway key and no AAB is built.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: tools/ci/prepare_android_export.sh
      - name: Apply the owner's console settings
        env:
          # Set in the repo's Actions settings (docs/PLUGINS.md); each is optional.
          PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
          PLAY_GAMES_PROJECT_ID: ${{ vars.PLAY_GAMES_PROJECT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 tools/ci/apply_owner_config.py
      - name: Export the debug APK
        run: |
          python3 tools/sync_sim.py
          timeout 300 godot --headless --path client --import
          mkdir -p build/android
          timeout 1200 godot --headless --path client --install-android-build-template \
            --export-debug "Android" "$GITHUB_WORKSPACE/build/android/aetd-m0-debug.apk"
          test -s build/android/aetd-m0-debug.apk
      - name: Check every plugin is in the APK
        run: tools/ci/check_apk_plugins.sh build/android/aetd-m0-debug.apk
      - name: Check the sim library's imports resolve on Android (API 24)
        run: python3 tools/ci/check_apk_sim_symbols.py build/android/aetd-m0-debug.apk "$ANDROID_HOME/ndk/29.0.14206865" 24
      # Uploaded unzipped, so a phone downloads the .apk itself; each artifact
      # is named after its file. Before the AAB, so a failed AAB keeps the APK.
      - uses: actions/upload-artifact@v7
        with:
          path: build/android/aetd-m0-debug.apk
          archive: false
          # A re-run uploads again under the same name.
          overwrite: true
      - name: Export the release AAB for Play
        if: steps.prepare.outputs.signing == 'upload-key'
        run: |
          timeout 1200 godot --headless --path client \
            --export-release "Android AAB" "$GITHUB_WORKSPACE/build/android/aetd-m0-release.aab"
          test -s build/android/aetd-m0-release.aab
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.signing == 'upload-key'
        with:
          path: build/android/aetd-m0-release.aab
          archive: false
          # A re-run uploads again under the same name.
          overwrite: true
